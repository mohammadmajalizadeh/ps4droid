#
# NOTE: this workflow has not been executed yet. It was written in a sandbox that
# cannot download the Android NDK. Treat the first run as the test of the workflow.
name: android

on:
  push:
  pull_request:

env:
  NDK_VERSION: 29.0.14206865 # r29: first NDK whose libc++ has std::jthread/stop_token/atomic_ref
  ANDROID_PLATFORM: android-31

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/host -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build/host
      - name: Test
        run: ctest --test-dir build/host --output-on-failure

  ndk-platform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Configure (arm64-v8a)
        run: |
          cmake -S . -B build/android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build/android-arm64
      - name: Check 16 KiB alignment of va_probe
        run: |
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -lW \
            build/android-arm64/platform/android/va_probe | grep LOAD
      - uses: actions/upload-artifact@v4
        with:
          name: va_probe-arm64-v8a
          path: build/android-arm64/platform/android/va_probe

  ndk-core:
    # Compile sweep of shadPS4 src/ with each NDK major version. The sweep log is the
    # deliverable (see docs/STUBS.md); failing units do not fail the job.
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # r27/r28 lack C++20 library features shadPS4 uses (run 43337640523); keep r29 only.
        ndk_major: [29]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch core and dependencies
        run: tools/fetch_core.sh
      - name: Apply patch series
        run: tools/apply_patches.sh
      - name: Install newest NDK of this major version
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ver=$("$sdk" --list 2>/dev/null | grep -oE "ndk;${{ matrix.ndk_major }}\.[0-9.]+" \
                | sed 's/ndk;//' | grep -v rc | sort -uV | tail -1)
          [ -n "$ver" ] || { echo "no NDK ${{ matrix.ndk_major }} available"; exit 1; }
          echo "Selected NDK $ver"
          yes | "$sdk" "ndk;$ver" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ver" >> "$GITHUB_ENV"
          "$ANDROID_HOME/ndk/$ver/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -1
      - name: Configure core (arm64-v8a)
        run: |
          cmake -S . -B build/android-core -G Ninja \
            -DPS4DROID_BUILD_CORE=ON \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Compile sweep of shadPS4 src/
        run: python3 tools/standin/syntax_check.py build/android-core build/sweep 4
      - name: Summarise
        if: always()
        run: |
          cut -f1 build/sweep/results.tsv | sort | uniq -c
          grep FAIL build/sweep/results.tsv || true
          # Error lines of every failing unit, so the log alone is enough to diagnose.
          for f in build/sweep/*.log; do
            [ -e "$f" ] || continue
            echo "=== $(head -1 "$f")"
            grep -E "error|warning: .*-W#warnings" "$f" | head -12
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ndk-compile-sweep-r${{ matrix.ndk_major }}
          path: build/sweep
